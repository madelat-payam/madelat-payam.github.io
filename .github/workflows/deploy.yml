name: Deploy to GitHub Pages

# Manual-only during the build so nothing publishes until launch. When the
# site is ready: enable Pages (Settings > Pages > Source: GitHub Actions) and
# uncomment the push trigger below so commits to main deploy automatically.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
